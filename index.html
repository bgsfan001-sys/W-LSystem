<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L</title>

<style>
    body {
        margin: 0;
        background: #eeeeee;
        font-family: Arial, sans-serif;
    }

    .gui {
        width: 90%;
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        background: white;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .jugadores {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .espacio {
        width: 45%;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 12px;
    }

    .nombre {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .value {
        margin-bottom: 10px;
    }

    .mas {
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        font-size: 30px;
        cursor: pointer;
    }

    .lista {
        display: none;
        margin-top: 10px;
    }

    .jugador {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: none;
        border-radius: 8px;
        background: #eeeeee;
        cursor: pointer;
    }

    .jugador:hover {
        background: #dddddd;
    }
</style>
</head>

<body>

<div class="gui">

    <h2>W / L</h2>

    <div class="jugadores">

        <!-- PRIMER COSO -->
        <div class="espacio">

            <div id="nombre1" class="nombre">
                Persona 1
            </div>

            <div id="value1" class="value">
                Value: 0
            </div>

            <button class="mas" onclick="abrirLista(1)">
                +
            </button>

            <div id="lista1" class="lista">

                <button class="jugador"
                    onclick="elegir(1, 'Messi', 10)">
                    Messi (+10)
                </button>

                <button class="jugador"
                    onclick="elegir(1, 'Ronaldo', 8)">
                    Ronaldo (+8)
                </button>

                <button class="jugador"
                    onclick="elegir(1, 'Mbappé', 6)">
                    Mbappé (+6)
                </button>

                <button class="jugador"
                    onclick="elegir(1, 'Neymar', 5)">
                    Neymar (+5)
                </button>

            </div>

        </div>


        <!-- SEGUNDO COSO -->
        <div class="espacio">

            <div id="nombre2" class="nombre">
                Persona 2
            </div>

            <div id="value2" class="value">
                Value: 0
            </div>

            <button class="mas" onclick="abrirLista(2)">
                +
            </button>

            <div id="lista2" class="lista">

                <button class="jugador"
                    onclick="elegir(2, 'Messi', 10)">
                    Messi (+10)
                </button>

                <button class="jugador"
                    onclick="elegir(2, 'Ronaldo', 8)">
                    Ronaldo (+8)
                </button>

                <button class="jugador"
                    onclick="elegir(2, 'Mbappé', 6)">
                    Mbappé (+6)
                </button>

                <button class="jugador"
                    onclick="elegir(2, 'Neymar', 5)">
                    Neymar (+5)
                </button>

            </div>

        </div>

    </div>

</div>


<script>

function abrirLista(numero) {

    const lista = document.getElementById("lista" + numero);

    if (lista.style.display === "block") {
        lista.style.display = "none";
    } else {
        lista.style.display = "block";
    }
}


function elegir(numero, nombre, value) {

    document.getElementById("nombre" + numero).textContent =
        nombre;

    document.getElementById("value" + numero).textContent =
        "Value: " + value;

    document.getElementById("lista" + numero).style.display =
        "none";
}

</script>

</body>
</html>
