<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;

    background: white;
    border-radius: 16px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

    text-align: center;
}

.title {
    margin-top: 0;
    margin-bottom: 20px;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;
    padding: 15px;

    border: 2px solid #dddddd;
    border-radius: 12px;

    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;

    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: #eeeeee;

    font-size: 30px;

    cursor: pointer;
}

.add-button:hover {
    background: #dddddd;
}


/* =========================
   PET MENU
========================= */

.pet-menu {
    display: none;
    margin-top: 15px;
}

.category-container {
    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    justify-content: center;
}

.category-button {
    width: 180px;
    min-height: 70px;

    border: none;
    border-radius: 12px;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: transform 0.15s;
}

.category-button:hover {
    transform: scale(1.03);
}

.limited-button {
    background: #d62828;
}

.robux-button {
    background: #22a447;
}


/* =========================
   PET LIST
========================= */

.pet-list {
    display: none;
    margin-top: 15px;
}

.back-button {
    width: 100%;

    padding: 10px;
    margin-bottom: 12px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

.back-button:hover {
    background: #dddddd;
}

.search {
    width: 100%;

    padding: 10px;
    margin-bottom: 12px;

    border: 1px solid #cccccc;
    border-radius: 8px;

    font-size: 15px;

    outline: none;
}

.player-options {
    display: flex;
    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;
}

.player-option {
    display: flex;

    align-items: center;

    gap: 8px;

    min-width: 125px;

    padding: 8px 12px;

    border: none;
    border-radius: 10px;

    background: #eeeeee;

    font-size: 14px;

    cursor: pointer;

    transition: background 0.15s;
}

.player-option:hover {
    background: #dddddd;
}

.player-image {
    width: 42px;
    height: 42px;

    object-fit: cover;

    border-radius: 8px;
}

.player-info {
    display: flex;

    flex-direction: column;

    align-items: flex-start;
}

.player-name {
    font-weight: bold;
}

.player-value {
    font-size: 13px;

    opacity: 0.7;
}


/* =========================
   EMPTY CATEGORY
========================= */

.empty-message {
    padding: 20px;

    color: #777777;

    font-size: 14px;
}


/* =========================
   HISTORY
========================= */

.history {
    margin-top: 15px;

    max-height: 180px;

    overflow-y: auto;

    text-align: left;
}

.history-item {
    display: flex;

    align-items: center;

    gap: 8px;

    margin: 5px 0;

    padding: 8px;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;
}

.history-image {
    width: 30px;
    height: 30px;

    object-fit: cover;

    border-radius: 6px;
}


/* =========================
   RESULT
========================= */

.result {
    margin-top: 20px;

    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;

    font-weight: bold;
}


/* =========================
   RESET
========================= */

.reset-button {
    margin-top: 15px;

    padding: 10px 20px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;
}

.reset-button:hover {
    background: #dddddd;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }

    .category-button {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- =========================
             PLAYER 1
        ========================== -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>


            <div
                id="total1"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openPetMenu(1)"
            >
                +
            </button>


            <!-- CATEGORY MENU -->

            <div
                id="petMenu1"
                class="pet-menu"
            >

                <div class="category-container">

                    <button
                        class="category-button limited-button"
                        onclick="openCategory(1, 'limited')"
                    >
                        Limited Secrets
                    </button>


                    <button
                        class="category-button robux-button"
                        onclick="openCategory(1, 'robux')"
                    >
                        Robux Pets
                    </button>

                </div>

            </div>


            <!-- PET LIST -->

            <div
                id="petList1"
                class="pet-list"
            >

                <button
                    class="back-button"
                    onclick="backToCategories(1)"
                >
                    ← Back
                </button>


                <input
                    id="search1"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(1)"
                >


                <div
                    id="players1"
                    class="player-options"
                >
                </div>

            </div>


            <!-- HISTORY -->

            <div
                id="history1"
                class="history"
            >
            </div>

        </div>



        <!-- =========================
             PLAYER 2
        ========================== -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>


            <div
                id="total2"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openPetMenu(2)"
            >
                +
            </button>


            <!-- CATEGORY MENU -->

            <div
                id="petMenu2"
                class="pet-menu"
            >

                <div class="category-container">

                    <button
                        class="category-button limited-button"
                        onclick="openCategory(2, 'limited')"
                    >
                        Limited Secrets
                    </button>


                    <button
                        class="category-button robux-button"
                        onclick="openCategory(2, 'robux')"
                    >
                        Robux Pets
                    </button>

                </div>

            </div>


            <!-- PET LIST -->

            <div
                id="petList2"
                class="pet-list"
            >

                <button
                    class="back-button"
                    onclick="backToCategories(2)"
                >
                    ← Back
                </button>


                <input
                    id="search2"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(2)"
                >


                <div
                    id="players2"
                    class="player-options"
                >
                </div>

            </div>


            <!-- HISTORY -->

            <div
                id="history2"
                class="history"
            >
            </div>

        </div>

    </div>


    <!-- TRADE RESULT -->

    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>

</div>



<script>


/*
=================================================
PET DATA
=================================================

To add a pet:

{
    name: "PetName",
    value: 100,
    image: "images/PetName.png"
}

The image must be inside the "images" folder.
=================================================
*/

const pets = {


    /*
    =============================================
    LIMITED SECRETS
    =============================================

    Empty for now.
    Add pets here later.
    */

    limited: [

    ],



    /*
    =============================================
    ROBUX PETS
    =============================================
    */

    robux: [

        {
            name: "Nythrael",
            value: 30,
            image: "images/Nythrael.png"
        },


        {
            name: "Kharvoth",
            value: 50,
            image: "images/Kharvoth.png"
        }

    ]

};



/*
=================================================
TOTALS
=================================================
*/

let total1 = 0;
let total2 = 0;



/*
=================================================
CURRENT CATEGORIES
=================================================
*/

let currentCategory1 = null;
let currentCategory2 = null;



/*
=================================================
OPEN PET MENU
=================================================
*/

function openPetMenu(player) {

    const menu =
        document.getElementById(
            "petMenu" + player
        );


    const list =
        document.getElementById(
            "petList" + player
        );


    if (
        menu.style.display === "block" ||
        list.style.display === "block"
    ) {

        menu.style.display = "none";

        list.style.display = "none";

    }

    else {

        menu.style.display = "block";

        list.style.display = "none";

    }

}



/*
=================================================
OPEN CATEGORY
=================================================
*/

function openCategory(
    player,
    category
) {

    if (player === 1) {

        currentCategory1 = category;

    }

    else {

        currentCategory2 = category;

    }


    document.getElementById(
        "petMenu" + player
    ).style.display = "none";


    document.getElementById(
        "petList" + player
    ).style.display = "block";


    document.getElementById(
        "search" + player
    ).value = "";


    createPetButtons(
        player,
        category
    );

}



/*
=================================================
BACK TO CATEGORY MENU
=================================================
*/

function backToCategories(player) {

    document.getElementById(
        "petList" + player
    ).style.display = "none";


    document.getElementById(
        "petMenu" + player
    ).style.display = "block";


    document.getElementById(
        "search" + player
    ).value = "";

}



/*
=================================================
CREATE PET BUTTONS
=================================================
*/

function createPetButtons(
    player,
    category
) {

    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    const categoryPets =
        pets[category];


    /*
    EMPTY CATEGORY
    */

    if (
        !categoryPets ||
        categoryPets.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-message";


        empty.textContent =
            "No pets available yet.";


        container.appendChild(
            empty
        );


        return;

    }



    /*
    CREATE PET BUTTONS
    */

    categoryPets.forEach(
        function(data) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "player-option";


            button.dataset.name =
                data.name.toLowerCase();



            /*
            PET IMAGE
            */

            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "player-image";


            image.src =
                data.image;


            image.alt =
                data.name;



            /*
            PET INFORMATION
            */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "player-info";



            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "player-name";


            name.textContent =
                data.name;



            const value =
                document.createElement(
                    "div"
                );


            value.className =
                "player-value";


            value.textContent =
                "+" + data.value;



            info.appendChild(
                name
            );


            info.appendChild(
                value
            );


            button.appendChild(
                image
            );


            button.appendChild(
                info
            );



            /*
            CLICK PET

            The list stays open.
            */

            button.onclick =
                function() {

                    addPet(
                        player,
                        data.name,
                        data.value,
                        data.image
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}



/*
=================================================
SEARCH
=================================================
*/

function searchPets(player) {

    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value.toLowerCase();


    const buttons =
        document
            .getElementById(
                "players" + player
            )
            .querySelectorAll(
                ".player-option"
            );


    buttons.forEach(
        function(button) {

            const name =
                button.dataset.name;


            if (
                name.includes(text)
            ) {

                button.style.display =
                    "flex";

            }

            else {

                button.style.display =
                    "none";

            }

        }
    );

}



/*
=================================================
ADD PET
=================================================
*/

function addPet(
    player,
    name,
    value,
    image
) {

    if (player === 1) {

        total1 += value;


        document.getElementById(
            "total1"
        ).textContent =
            total1;


        addHistory(
            1,
            name,
            value,
            image
        );

    }

    else {

        total2 += value;


        document.getElementById(
            "total2"
        ).textContent =
            total2;


        addHistory(
            2,
            name,
            value,
            image
        );

    }


    /*
    Recalculate the trade
    every time a pet is added.
    */

    checkTrade();

}



/*
=================================================
ADD HISTORY
=================================================
*/

function addHistory(
    player,
    name,
    value,
    image
) {

    const history =
        document.getElementById(
            "history" + player
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item";



    const imageElement =
        document.createElement(
            "img"
        );


    imageElement.className =
        "history-image";


    imageElement.src =
        image;


    imageElement.alt =
        name;



    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        name + " +" + value;



    item.appendChild(
        imageElement
    );


    item.appendChild(
        text
    );


    history.appendChild(
        item
    );


    history.scrollTop =
        history.scrollHeight;

}



/*
=================================================
TRADE RESULT
=================================================
*/

function checkTrade() {

    const result =
        document.getElementById(
            "result"
        );


    /*
    Nothing added yet.
    */

    if (
        total1 === 0 &&
        total2 === 0
    ) {

        result.textContent =
            "Waiting for players...";

        return;

    }



    /*
    Player 1 has more value.
    */

    if (total1 > total2) {

        const difference =
            total1 - total2;


        result.textContent =
            "You win " +
            difference +
            " value! [W Trade]";

        return;

    }



    /*
    Player 2 has more value.
    */

    if (total2 > total1) {

        const difference =
            total2 - total1;


        result.textContent =
            "You are losing " +
            difference +
            " value! [L Trade]";

        return;

    }



    /*
    Same value.
    */

    result.textContent =
        "Balanced Trade! [B Trade]";

}



/*
=================================================
RESET
=================================================
*/

function resetGame() {

    total1 = 0;
    total2 = 0;


    currentCategory1 = null;
    currentCategory2 = null;



    document.getElementById(
        "total1"
    ).textContent =
        "0";


    document.getElementById(
        "total2"
    ).textContent =
        "0";



    document.getElementById(
        "history1"
    ).innerHTML =
        "";


    document.getElementById(
        "history2"
    ).innerHTML =
        "";



    document.getElementById(
        "result"
    ).textContent =
        "Waiting for players...";



    document.getElementById(
        "petMenu1"
    ).style.display =
        "none";


    document.getElementById(
        "petMenu2"
    ).style.display =
        "none";


    document.getElementById(
        "petList1"
    ).style.display =
        "none";


    document.getElementById(
        "petList2"
    ).style.display =
        "none";



    document.getElementById(
        "search1"
    ).value =
        "";


    document.getElementById(
        "search2"
    ).value =
        "";

}

</script>


</body>
</html>
