<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    text-align: center;
}

.title {
    margin-top: 0;
    margin-bottom: 20px;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;
    padding: 15px;
    border: 2px solid #dddddd;
    border-radius: 12px;
    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;
    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: #eeeeee;

    font-size: 30px;
    cursor: pointer;
}

.add-button:hover {
    background: #dddddd;
}

.player-list {
    display: none;
    margin-top: 15px;
}

.search {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;

    border: 1px solid #cccccc;
    border-radius: 8px;

    font-size: 15px;
    outline: none;
}

.player-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.player-option {
    display: flex;
    align-items: center;
    gap: 8px;

    min-width: 125px;

    padding: 8px 12px;

    border: none;
    border-radius: 10px;

    background: #eeeeee;

    font-size: 14px;
    cursor: pointer;
}

.player-option:hover {
    background: #dddddd;
}

.player-image {
    width: 42px;
    height: 42px;

    object-fit: cover;

    border-radius: 8px;
}

.player-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.player-name {
    font-weight: bold;
}

.player-value {
    font-size: 13px;
    opacity: 0.7;
}

.history {
    margin-top: 15px;

    max-height: 180px;
    overflow-y: auto;

    text-align: left;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 8px;

    margin: 5px 0;
    padding: 8px;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;
}

.history-image {
    width: 30px;
    height: 30px;

    object-fit: cover;

    border-radius: 6px;
}

.result {
    margin-top: 20px;
    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;
    font-weight: bold;
}

.reset-button {
    margin-top: 15px;

    padding: 10px 20px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;
}

.reset-button:hover {
    background: #dddddd;
}

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>

            <div
                id="total1"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(1)"
            >
                +
            </button>


            <div
                id="list1"
                class="player-list"
            >

                <input
                    id="search1"
                    class="search"
                    type="text"
                    placeholder="Search player..."
                    oninput="searchPlayers(1)"
                >


                <div
                    id="players1"
                    class="player-options"
                >
                </div>

            </div>


            <div
                id="history1"
                class="history"
            >
            </div>

        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>

            <div
                id="total2"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(2)"
            >
                +
            </button>


            <div
                id="list2"
                class="player-list"
            >

                <input
                    id="search2"
                    class="search"
                    type="text"
                    placeholder="Search player..."
                    oninput="searchPlayers(2)"
                >


                <div
                    id="players2"
                    class="player-options"
                >
                </div>

            </div>


            <div
                id="history2"
                class="history"
            >
            </div>

        </div>

    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>

</div>



<script>


/*
=================================================
PLAYER DATA

FORMAT:

Name,Value,ImagePath

The image path is relative to index.html.
=================================================
*/

const playerData = `

Kharvoth,50,images/Kharvoth.png
Nythrael,30,images/Nythrael.png

`;



/*
=================================================
CONVERT PLAYER DATA
=================================================
*/

const players = playerData
    .trim()
    .split("\n")
    .filter(line => line.trim() !== "")
    .map(line => {

        const parts = line.split(",");

        return {
            name: parts[0].trim(),
            value: Number(parts[1].trim()),
            image: parts.slice(2).join(",").trim()
        };

    });



/*
=================================================
TOTALS
=================================================
*/

let total1 = 0;
let total2 = 0;



/*
=================================================
CREATE PLAYER BUTTONS
=================================================
*/

function createPlayerButtons(player) {

    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    players.forEach(function(data) {

        const button =
            document.createElement("button");


        button.className =
            "player-option";


        button.dataset.name =
            data.name.toLowerCase();



        /*
        IMAGE
        */

        const image =
            document.createElement("img");


        image.className =
            "player-image";


        image.src =
            data.image;


        image.alt =
            data.name;



        /*
        INFORMATION
        */

        const info =
            document.createElement("div");


        info.className =
            "player-info";



        const name =
            document.createElement("div");


        name.className =
            "player-name";


        name.textContent =
            data.name;



        const value =
            document.createElement("div");


        value.className =
            "player-value";


        value.textContent =
            "+" + data.value;



        info.appendChild(name);
        info.appendChild(value);


        button.appendChild(image);
        button.appendChild(info);



        /*
        CLICK
        */

        button.onclick =
            function() {

                addPlayer(
                    player,
                    data.name,
                    data.value,
                    data.image
                );

            };


        container.appendChild(button);

    });

}



/*
=================================================
CREATE BOTH PLAYER LISTS
=================================================
*/

createPlayerButtons(1);
createPlayerButtons(2);



/*
=================================================
OPEN PLAYER LIST
=================================================
*/

function openList(player) {

    const list =
        document.getElementById(
            "list" + player
        );


    if (list.style.display === "block") {

        list.style.display = "none";

    } else {

        list.style.display = "block";


        document.getElementById(
            "search" + player
        ).focus();

    }

}



/*
=================================================
SEARCH PLAYERS
=================================================
*/

function searchPlayers(player) {

    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value.toLowerCase();


    const buttons =
        document
            .getElementById(
                "players" + player
            )
            .querySelectorAll(
                ".player-option"
            );


    buttons.forEach(function(button) {

        const name =
            button.dataset.name;


        if (name.includes(text)) {

            button.style.display =
                "flex";

        } else {

            button.style.display =
                "none";

        }

    });

}



/*
=================================================
ADD PLAYER
=================================================
*/

function addPlayer(
    player,
    name,
    value,
    image
) {

    if (player === 1) {

        total1 += value;


        document.getElementById(
            "total1"
        ).textContent = total1;


        addHistory(
            1,
            name,
            value,
            image
        );


        document.getElementById(
            "list1"
        ).style.display = "none";


    } else {

        total2 += value;


        document.getElementById(
            "total2"
        ).textContent = total2;


        addHistory(
            2,
            name,
            value,
            image
        );


        document.getElementById(
            "list2"
        ).style.display = "none";

    }


    checkWinner();

}



/*
=================================================
ADD HISTORY ITEM
=================================================
*/

function addHistory(
    player,
    name,
    value,
    image
) {

    const history =
        document.getElementById(
            "history" + player
        );


    const item =
        document.createElement("div");


    item.className =
        "history-item";


    const imageElement =
        document.createElement("img");


    imageElement.className =
        "history-image";


    imageElement.src =
        image;


    imageElement.alt =
        name;


    const text =
        document.createElement("span");


    text.textContent =
        name + " +" + value;


    item.appendChild(
        imageElement
    );


    item.appendChild(
        text
    );


    history.appendChild(
        item
    );


    history.scrollTop =
        history.scrollHeight;

}



/*
=================================================
CHECK WINNER
=================================================
*/

function checkWinner() {

    const result =
        document.getElementById(
            "result"
        );


    if (
        total1 === 0 &&
        total2 === 0
    ) {

        result.textContent =
            "Waiting for players...";

    }

    else if (total1 > total2) {

        result.textContent =
            "🏆 Player 1 wins";

    }

    else if (total2 > total1) {

        result.textContent =
            "🏆 Player 2 wins";

    }

    else {

        result.textContent =
            "🤝 Draw";

    }

}



/*
=================================================
RESET
=================================================
*/

function resetGame() {

    total1 = 0;
    total2 = 0;


    document.getElementById(
        "total1"
    ).textContent = "0";


    document.getElementById(
        "total2"
    ).textContent = "0";


    document.getElementById(
        "history1"
    ).innerHTML = "";


    document.getElementById(
        "history2"
    ).innerHTML = "";


    document.getElementById(
        "result"
    ).textContent =
        "Waiting for players...";


    document.getElementById(
        "list1"
    ).style.display = "none";


    document.getElementById(
        "list2"
    ).style.display = "none";


    document.getElementById(
        "search1"
    ).value = "";


    document.getElementById(
        "search2"
    ).value = "";


    searchPlayers(1);
    searchPlayers(2);

}

</script>


</body>
</html>
