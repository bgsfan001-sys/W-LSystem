<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>W/L System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .gui {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 20px;

            background: white;
            border-radius: 16px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .title {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .players {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .player-box {
            width: 50%;
            min-height: 250px;

            padding: 15px;

            border: 2px solid #dddddd;
            border-radius: 12px;

            background: #fafafa;
        }

        .player-title {
            font-size: 20px;
            font-weight: bold;
        }

        .total {
            margin-top: 8px;

            font-size: 26px;
            font-weight: bold;
        }

        .add-button {
            width: 50px;
            height: 50px;

            margin-top: 10px;

            border: none;
            border-radius: 50%;

            background: #eeeeee;

            font-size: 30px;

            cursor: pointer;
        }

        .add-button:hover {
            background: #dddddd;
        }

        .player-list {
            display: none;

            margin-top: 10px;
            padding: 5px;
        }

        .player-option {
            display: block;

            width: 100%;

            margin: 5px 0;
            padding: 10px;

            border: none;
            border-radius: 8px;

            background: #eeeeee;

            font-size: 15px;

            cursor: pointer;
        }

        .player-option:hover {
            background: #dddddd;
        }

        .history {
            margin-top: 15px;

            max-height: 180px;
            overflow-y: auto;

            text-align: left;
        }

        .history-item {
            padding: 7px 10px;
            margin: 4px 0;

            border-radius: 7px;

            background: #eeeeee;

            font-size: 14px;
        }

        .result {
            margin-top: 20px;
            padding: 12px;

            border-radius: 10px;

            background: #eeeeee;

            font-size: 20px;
            font-weight: bold;
        }

        .reset-button {
            margin-top: 15px;

            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: #eeeeee;

            cursor: pointer;
        }

        .reset-button:hover {
            background: #dddddd;
        }

        @media (max-width: 500px) {

            .players {
                flex-direction: column;
            }

            .player-box {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>

            <div id="total1" class="total">
                0
            </div>


            <button
                class="add-button"
                onclick="openList(1)"
            >
                +
            </button>


            <div id="list1" class="player-list">


                <button
                    class="player-option"
                    onclick="addPlayer(1, 'Messi', 10)"
                >
                    Messi +10
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(1, 'Ronaldo', 8)"
                >
                    Ronaldo +8
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(1, 'Mbappe', 6)"
                >
                    Mbappe +6
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(1, 'Neymar', 5)"
                >
                    Neymar +5
                </button>


            </div>


            <div
                id="history1"
                class="history"
            >
            </div>


        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>

            <div id="total2" class="total">
                0
            </div>


            <button
                class="add-button"
                onclick="openList(2)"
            >
                +
            </button>


            <div id="list2" class="player-list">


                <button
                    class="player-option"
                    onclick="addPlayer(2, 'Messi', 10)"
                >
                    Messi +10
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(2, 'Ronaldo', 8)"
                >
                    Ronaldo +8
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(2, 'Mbappe', 6)"
                >
                    Mbappe +6
                </button>


                <button
                    class="player-option"
                    onclick="addPlayer(2, 'Neymar', 5)"
                >
                    Neymar +5
                </button>


            </div>


            <div
                id="history2"
                class="history"
            >
            </div>


        </div>


    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>


</div>



<script>


/* =========================
   PLAYER TOTALS
========================= */

let total1 = 0;
let total2 = 0;



/* =========================
   OPEN / CLOSE PLAYER LIST
========================= */

function openList(player) {

    const list =
        document.getElementById("list" + player);


    if (list.style.display === "block") {

        list.style.display = "none";

    } else {

        list.style.display = "block";

    }

}



/* =========================
   ADD PLAYER VALUE
========================= */

function addPlayer(player, name, value) {


    if (player === 1) {


        // Add value to Player 1

        total1 += value;


        // Update Player 1 total

        document.getElementById("total1")
            .textContent = total1;


        // Add entry to Player 1 history

        document.getElementById("history1")
            .innerHTML +=
            '<div class="history-item">' +
            name +
            ' +' +
            value +
            '</div>';


        // Close Player 1 list

        document.getElementById("list1")
            .style.display = "none";


    } else {


        // Add value to Player 2

        total2 += value;


        // Update Player 2 total

        document.getElementById("total2")
            .textContent = total2;


        // Add entry to Player 2 history

        document.getElementById("history2")
            .innerHTML +=
            '<div class="history-item">' +
            name +
            ' +' +
            value +
            '</div>';


        // Close Player 2 list

        document.getElementById("list2")
            .style.display = "none";

    }


    // Check who is winning

    checkWinner();

}



/* =========================
   CHECK WINNER
========================= */

function checkWinner() {


    const result =
        document.getElementById("result");


    if (total1 === 0 && total2 === 0) {


        result.textContent =
            "Waiting for players...";


    }


    else if (total1 > total2) {


        result.textContent =
            "🏆 Player 1 wins";


    }


    else if (total2 > total1) {


        result.textContent =
            "🏆 Player 2 wins";


    }


    else {


        result.textContent =
            "🤝 Draw";

    }

}



/* =========================
   RESET EVERYTHING
========================= */

function resetGame() {


    total1 = 0;
    total2 = 0;


    document.getElementById("total1")
        .textContent = "0";


    document.getElementById("total2")
        .textContent = "0";


    document.getElementById("history1")
        .innerHTML = "";


    document.getElementById("history2")
        .innerHTML = "";


    document.getElementById("result")
        .textContent =
        "Waiting for players...";


    document.getElementById("list1")
        .style.display = "none";


    document.getElementById("list2")
        .style.display = "none";

}


</script>


</body>

    </html>
