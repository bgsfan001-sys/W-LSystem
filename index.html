<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 20px;

    background: white;
    border-radius: 16px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

    text-align: center;
}

.title {
    margin-top: 0;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;

    padding: 15px;

    border: 2px solid #dddddd;
    border-radius: 12px;

    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;

    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: #eeeeee;

    font-size: 30px;

    cursor: pointer;
}

.add-button:hover {
    background: #dddddd;
}

.player-list {
    display: none;

    margin-top: 15px;
}

.player-card {
    margin-bottom: 12px;
    padding: 10px;

    background: white;

    border-radius: 10px;

    border: 1px solid #dddddd;
}

.player-name {
    font-weight: bold;
    margin-bottom: 8px;
}

.amount-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
}

.amount-button {
    padding: 8px 12px;

    border: none;
    border-radius: 7px;

    background: #eeeeee;

    cursor: pointer;
}

.amount-button:hover {
    background: #dddddd;
}

.history {
    margin-top: 15px;

    max-height: 180px;

    overflow-y: auto;

    text-align: left;
}

.history-item {
    margin: 5px 0;

    padding: 8px;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;
}

.result {
    margin-top: 20px;

    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;
    font-weight: bold;
}

.reset-button {
    margin-top: 15px;

    padding: 10px 20px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;
}

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>

            <div
                id="total1"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(1)"
            >
                +
            </button>


            <div
                id="list1"
                class="player-list"
            >


                <!-- MESSI -->

                <div class="player-card">

                    <div class="player-name">
                        Messi — Value 10
                    </div>

                    <div class="amount-buttons">

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Messi', 10, 1)"
                        >
                            ×1
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Messi', 10, 2)"
                        >
                            ×2
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Messi', 10, 3)"
                        >
                            ×3
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Messi', 10, 4)"
                        >
                            ×4
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Messi', 10, 5)"

                            ×5
                        </button>

                    </div>

                </div>


                <!-- RONALDO -->

                    <div class="player-name">
                        Ronaldo — Value 8
                    </div>

                    <div class="amount-buttons">

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Ronaldo', 8, 1)"
                        >
                            ×1
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Ronaldo', 8, 2)"
                        >
                            ×2
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Ronaldo', 8, 3)"
                        >
                            ×3
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Ronaldo', 8, 4)"
                        >
                            ×4
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Ronaldo', 8, 5)"
                        >
                            ×5
                        </button>

                    </div>

                </div>


                <!-- MBAPPE -->

                <div class="player-card">

                    <div class="player-name">
                        Mbappe — Value 6
                    </div>

                    <div class="amount-buttons">

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Mbappe', 6, 1)"
                        >
                            ×1
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Mbappe', 6, 2)"
                        >
                            ×2
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Mbappe', 6, 3)"
                        >
                            ×3
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Mbappe', 6, 4)"
                        >
                            ×4
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(1, 'Mbappe', 6, 5)"
                        >
                            ×5
                        </button>

                    </div>

                </div>


            </div>


            <div
                id="history1"
                class="history"
            ></div>

        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>

            <div
                id="total2"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(2)"
            >
                +
            </button>


            <div
                id="list2"
                class="player-list"
            >


                <!-- MESSI -->

                <div class="player-card">

                    <div class="player-name">
                        Messi — Value 10
                    </div>

                    <div class="amount-buttons">

                        <button
                            class="amount-button"
                            onclick="addPlayer(2, 'Messi', 10, 1)"
                        >
                            ×1
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(2, 'Messi', 10, 2)"
                        >
                            ×2
                        </button>

                        <button
                            class="amount-button"
                            onclick="addPlayer(2, 'Messi', 10, 3)"
                        >

                        </button>

                        <button

                            onclick="addPlayer(2, 'Messi', 10, 4)"

                        <button

                            onclick="addPlayer(2, 'Messi', 10, 5)"

                    <div class="amount-buttons">

                        <button

                        <button

                        <button

                        >

                        <button

                            onclick="addPlayer(2, 'Ronaldo', 8, 4)"
                        >
                            ×4
                        </button>

                        <button

                            onclick="addPlayer(2, 'Ronaldo', 8, 5)"
                        >

                        </button>

                    </div>

                </div>


                <!-- MBAPPE -->

                <div class="player-card">

                    <div class="player-name">
                        Mbappe — Value 6
                    </div>

                    <div class="amount-buttons">

                        <button
                            class="amount-button"
                            onclick="addPlayer(2, 'Mbappe', 6, 1)"

                        <button

                        <button

                        </button>

                        <button

                        <button

                            onclick="addPlayer(2, 'Mbappe', 6, 5)"

                    </div>

                </div>


            </div>


            <div
                id="history2"
                class="history"
            ></div>

        </div>


    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>


</div>



<script>


let total1 = 0;
let total2 = 0;



function openList(player) {

    const list =
        document.getElementById("list" + player);


    if (list.style.display === "block") {

        list.style.display = "none";

    } else {

        list.style.display = "block";

    }

}



function addPlayer(player, name, value, amount) {


    const addedValue =
        value * amount;


    if (player === 1) {

        total1 += addedValue;


        document.getElementById("total1")
            .textContent = total1;


        document.getElementById("history1")
            .innerHTML +=
            '<div class="history-item">' +
            name +
            ' ×' +
            amount +
            ' = +' +
            addedValue +
            '</div>';


        document.getElementById("list1")
            .style.display = "none";


    } else {

        total2 += addedValue;


        document.getElementById("total2")
            .textContent = total2;


        document.getElementById("history2")
            .innerHTML +=
            '<div class="history-item">' +
            name +
            ' ×' +
            amount +
            ' = +' +
            addedValue +
            '</div>';


        document.getElementById("list2")
            .style.display = "none";

    }


    checkWinner();

}



function checkWinner() {

    const result =
        document.getElementById("result");


    if (total1 === 0 && total2 === 0) {

        result.textContent =
            "Waiting for players...";

    }

    else if (total1 > total2) {

        result.textContent =
            "🏆 Player 1 wins";

    }

    else if (total2 > total1) {

        result.textContent =
            "🏆 Player 2 wins";

    }

    else {

        result.textContent =
            "🤝 Draw";

    }

}



function resetGame() {

    total1 = 0;
    total2 = 0;


    document.getElementById("total1")
        .textContent = "0";


    document.getElementById("total2")
        .textContent = "0";


    document.getElementById("history1")
        .innerHTML = "";


    document.getElementById("history2")
        .innerHTML = "";


    document.getElementById("result")
        .textContent =
            "Waiting for players...";


    document.getElementById("list1")
        .style.display = "none";


    document.getElementById("list2")
        .style.display = "none";

}

</script>


</body>
</html>
