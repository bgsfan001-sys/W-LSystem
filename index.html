<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    text-align: center;
}

.title {
    margin-top: 0;
    margin-bottom: 20px;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;
    padding: 15px;
    border: 2px solid #dddddd;
    border-radius: 12px;
    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;
    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #eeeeee;
    font-size: 30px;
    cursor: pointer;
}

.add-button:hover {
    background: #dddddd;
}

.pet-list {
    display: none;
    margin-top: 15px;
}

.search {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #cccccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.player-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
}

.player-option {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    padding: 8px;
    border: none;
    border-radius: 10px;
    background: #eeeeee;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
}

.player-option:hover {
    background: #dddddd;
}

.player-image {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 8px;
}

.player-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.player-name {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
}

.player-value {
    font-size: 13px;
    opacity: 0.7;
}

.history {
    margin-top: 15px;
    max-height: 180px;
    overflow-y: auto;
    text-align: left;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin: 5px 0;
    padding: 8px;
    border: none;
    border-radius: 7px;
    background: #eeeeee;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
}

.history-item:hover {
    background: #dddddd;
}

.history-image {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 6px;
}

.result {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #eeeeee;
    font-size: 20px;
    font-weight: bold;
}

.reset-button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #eeeeee;
    cursor: pointer;
}

.reset-button:hover {
    background: #dddddd;


/* O/C VALUE WINDOW */

.value-window {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    padding: 20px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    z-index: 1000;
}

.value-window h3 {
    margin-top: 0;
}

.value-window input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #cccccc;
    border-radius: 8px;
    font-size: 16px;
}

.value-window button {
    padding: 9px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 3px;
}

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>

            <div
                id="total1"
                class="total"
            >
                0
            </div>

            <button
                class="add-button"
                onclick="openPetList(1)"
            >
                +
            </button>

            <div
                id="petList1"
                class="pet-list"
            >

                <input
                    id="search1"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(1)"
                >

                <div
                    id="players1"
                    class="player-options"
                ></div>

            </div>

            <div
                id="history1"
                class="history"
            ></div>

        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>

            <div
                id="total2"
                class="total"
            >
                0
            </div>

            <button
                class="add-button"
                onclick="openPetList(2)"
            >
                +
            </button>

            <div
                id="petList2"
                class="pet-list"
            >

                <input
                    id="search2"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(2)"
                >

                <div
                    id="players2"
                    class="player-options"
                ></div>

            </div>

            <div
                id="history2"
                class="history"
            ></div>

        </div>

    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>

</div>



<!-- O/C VALUE WINDOW -->

<div
    id="valueWindow"
    class="value-window"
>

    <h3>
        Enter Pet Value
    </h3>

    <input
        id="customValue"
        type="number"
        min="0"
        placeholder="Example: 50000"
    >

    <br>

    <button
        onclick="confirmCustomValue()"
    >
        Add
    </button>

    <button
        onclick="closeValueWindow()"
    >
        Cancel
    </button>

</div>



<script>


/*
====================================================
PET LIST

All Shiny pets have value 0.

Krakena is O/C and opens a custom
value window when selected.
====================================================
*/

const petData = `

Hellish Pumpkin,3450,images/Pumpkin_V2.png
Shiny Hellish Pumpkin,0,images/Pumpkin_V2.png

Infernal Luminance,4300,images/DRadiance.png
Shiny Infernal Luminance,0,images/DRadiance.png

Pyramifernal,8900,images/Pyramfernal.png
Shiny Pyramifernal,0,images/Pyramfernal.png

Apocalyptic Trident,13500,images/Tridente.png
Shiny Apocalyptic Trident,0,images/Tridente.png

Bloody Eye,2800,images/Blood_eye.png
Shiny Bloody Eye,0,images/Blood_eye.png

Lunatic Eye,3300,images/Ojo_lunatico.png
Shiny Lunatic Eye,0,images/Ojo_lunatico.png

Cursed Guardian,4100,images/Demonic_Cursed.png
Shiny Cursed Guardian,0,images/Demonic_Cursed.png

Ommeviathan,7450,images/Omegaa.png
Shiny Ommeviathan,0,images/Omegaa.png

Primordial Sinister,12000,images/SINISTERr.png
Shiny Primordial Sinister,0,images/SINISTERr.png

Demonic Marshmellow,3100,images/unnamed (6).png
Shiny Demonic Marshmellow,0,images/unnamed (6).png

Supernova,3600,images/Supernova.png
Shiny Supernova,0,images/Supernova.png

Dark Radiance,4300,images/Dark_Radiance.png
Shiny Dark Radiance,0,images/Dark_Radiance.png

Sinister Lord,7800,images/unnamed (4).png
Shiny Sinister Lord,0,images/unnamed (4).png

Pyramighost,14500,images/Pyramghost.png
Shiny Pyramighost,0,images/Pyramghost.png

Radiance,4800,images/unnamed (5).png
Shiny Radiance,0,images/unnamed (5).png

Nocturnal Skull,22500,images/Noctur_Skull_V2-1.png
Shiny Nocturnal Skull,0,images/Noctur_Skull_V2-1.png

Shadow Skull,22500,images/Shadow_Skull_V2-1.png
Shiny Shadow Skull,0,images/Shadow_Skull_V2-1.png

Ying Yang Skull,22500,images/Ying_Yang_Skull-1.png
Shiny Ying Yang Skull,0,images/Ying_Yang_Skull-1.png

Diabolical Skull,22500,images/Diabolical_Skull-1.png
Shiny Diabolical Skull,0,images/Diabolical_Skull-1.png

Angelic Skull,22500,images/Skull_V2-1.png
Shiny Angelic Skull,0,images/Skull_V2-1.png

Queen Skull,22500,images/Queen_Skull-1.png
Shiny Queen Skull,0,images/Queen_Skull-1.png

Zombie Skull,22500,images/Zombie_Skull-1.png
Shiny Zombie Skull,0,images/Zombie_Skull-1.png

Krakena,O/C,images/Krakena-1.png
Shiny Krakena,0,images/Krakena-1.png

Kharvoth,5500,images/Kharvoth.png
Shiny Kharvoth,0,images/Kharvoth.png

Nythrael,5500,images/Nythrael.png
Shiny Nythrael,0,images/Nythrael.png

`;



/*
====================================================
PARSE PETS
====================================================
*/

const pets = [];


petData
    .trim()
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .forEach(line => {

        const firstComma =
            line.indexOf(",");

        const secondComma =
            line.indexOf(
                ",",
                firstComma + 1
            );


        if (
            firstComma === -1 ||
            secondComma === -1
        ) {
            return;
        }


        const name =
            line.slice(
                0,
                firstComma
            ).trim();


        const valueText =
            line.slice(
                firstComma + 1,
                secondComma
            ).trim();


        const image =
            line.slice(
                secondComma + 1
            ).trim();


        if (
            !name ||
            !image
        ) {
            return;
        }


        pets.push({

            name: name,

            value:
                valueText === "O/C"
                    ? 0
                    : Number(valueText),

            valueText: valueText,

            image: image

        });

    });



/*
====================================================
TRADE ARRAYS
====================================================
*/

const player1Pets = [];

const player2Pets = [];

let total1 = 0;

let total2 = 0;


/*
Current player waiting for
custom O/C value.
*/

let customPlayer = null;

let customPet = null;



/*
====================================================
OPEN PET LIST
====================================================
*/

function openPetList(player) {

    const list =
        document.getElementById(
            "petList" + player
        );


    if (
        list.style.display === "block"
    ) {

        list.style.display =
            "none";

    } else {

        list.style.display =
            "block";

        createPetButtons(player);

    }

}



/*
====================================================
CREATE PET BUTTONS
====================================================
*/

function createPetButtons(player) {

    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    pets.forEach(
        function(pet, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";

            button.className =
                "player-option";


            button.dataset.petIndex =
                index;


            button.dataset.name =
                pet.name.toLowerCase();


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "player-image";


            image.src =
                pet.image;


            image.alt =
                pet.name;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "player-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "player-name";


            name.textContent =
                pet.name;


            const value =
                document.createElement(
                    "div"
                );


            value.className =
                "player-value";


            value.textContent =
                pet.valueText;


            info.appendChild(
                name
            );


            info.appendChild(
                value
            );


            button.appendChild(
                image
            );


            button.appendChild(
                info
            );


            button.onclick =
                function() {

                    /*
                    Krakena = custom value
                    */

                    if (
                        pet.name === "Krakena"
                    ) {

                        openValueWindow(
                            player,
                            pet
                        );

                    } else {

                        addPet(
                            player,
                            pet
                        );

                    }

                };


            container.appendChild(
                button
            );

        }
    );

}



/*
====================================================
OPEN O/C WINDOW
====================================================
*/

function openValueWindow(
    player,
    pet
) {

    customPlayer =
        player;

    customPet =
        pet;


    const windowElement =
        document.getElementById(
            "valueWindow"
        );


    const input =
        document.getElementById(
            "customValue"
        );


    input.value = "";


    windowElement.style.display =
        "block";


    setTimeout(
        function() {

            input.focus();

        },
        50
    );

}



/*
====================================================
CLOSE O/C WINDOW
====================================================
*/

function closeValueWindow() {

    document.getElementById(
        "valueWindow"
    ).style.display =
        "none";


    customPlayer =
        null;

    customPet =
        null;

}



/*
====================================================
CONFIRM O/C VALUE
====================================================
*/

function confirmCustomValue() {

    if (
        customPlayer === null ||
        customPet === null
    ) {
        return;
    }


    const input =
        document.getElementById(
            "customValue"
        );


    const value =
        Number(
            input.value
        );


    if (
        !Number.isFinite(value) ||
        value < 0
    ) {

        return;

    }


    const customPetCopy = {

        name:
            customPet.name,

        value:
            value,

        valueText:
            value.toString(),

        image:
            customPet.image

    };


    addPet(
        customPlayer,
        customPetCopy
    );


    closeValueWindow();

}



/*
====================================================
SEARCH
====================================================
*/

function searchPets(player) {

    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value
            .toLowerCase()
            .trim();


    const buttons =
        document
            .getElementById(
                "players" + player
            )
            .querySelectorAll(
                ".player-option"
            );


    buttons.forEach(
        function(button) {

            const name =
                button.dataset.name;


            button.style.display =
                name.includes(text)
                    ? "flex"
                    : "none";

        }
    );

}



/*
====================================================
ADD PET
====================================================
*/

function addPet(
    player,
    pet
) {

    const tradePet = {

        id:
            Date.now() +
            Math.random(),

        name:
            pet.name,

        value:
            Number(pet.value) || 0,

        valueText:
            pet.valueText,

        image:
            pet.image

    };


    if (
        player === 1
    ) {

        player1Pets.push(
            tradePet
        );

    } else {

        player2Pets.push(
            tradePet
        );

    }


    updateTrade();

}



/*
====================================================
REMOVE PET FROM TRADE

Click the pet inside the trade
to remove that exact copy.
====================================================
*/

function removePet(
    player,
    petId
) {

    const list =
        player === 1
            ? player1Pets
            : player2Pets;


    const index =
        list.findIndex(
            pet =>
                pet.id === petId
        );


    if (
        index !== -1
    ) {

        list.splice(
            index,
            1
        );

    }


    updateTrade();

}



/*
====================================================
UPDATE TRADE
====================================================
*/

function updateTrade() {

    total1 =
        calculateTotal(
            player1Pets
        );


    total2 =
        calculateTotal(
            player2Pets
        );


    document.getElementById(
        "total1"
    ).textContent =
        total1;


    document.getElementById(
        "total2"
    ).textContent =
        total2;


    renderTradePets(
        1,
        player1Pets
    );


    renderTradePets(
        2,
        player2Pets
    );


    checkTrade();

}



/*
====================================================
CALCULATE TOTAL
====================================================
*/

function calculateTotal(
    list
) {

    return list.reduce(
        function(total, pet) {

            return total +
                (Number(pet.value) || 0);

        },
        0
    );

}



/*
====================================================
RENDER TRADE PETS

These are the pets currently
inside the trade.

Clicking one removes it.
====================================================
*/

function renderTradePets(
    player,
    list
) {

    const history =
        document.getElementById(
            "history" + player
        );


    history.innerHTML = "";


    list.forEach(
        function(pet) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "history-item";


            button.dataset.petId =
                pet.id;


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "history-image";


            image.src =
                pet.image;


            image.alt =
                pet.name;


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                pet.name +
                " +" +
                pet.valueText;


            button.appendChild(
                image
            );


            button.appendChild(
                text
            );


            button.onclick =
                function() {

                    removePet(
