<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>W/L System</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 20px;

    background: #eeeeee;

    font-family: Arial, sans-serif;

}


.gui {

    width: 100%;

    max-width: 950px;

    margin: auto;

    padding: 20px;

    background: white;

    border-radius: 16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.15);

    text-align: center;

}


.title {

    margin-top: 0;

    margin-bottom: 20px;

}


.players {

    display: flex;

    gap: 15px;

}


.player-box {

    width: 50%;

    padding: 15px;

    border: 2px solid #dddddd;

    border-radius: 12px;

    background: #fafafa;

}


.player-title {

    font-size: 20px;

    font-weight: bold;

}


.total {

    margin: 10px;

    font-size: 28px;

    font-weight: bold;

}


.add-button {

    width: 50px;

    height: 50px;

    border: none;

    border-radius: 50%;

    background: #eeeeee;

    font-size: 30px;

    cursor: pointer;

}


.add-button:hover {

    background: #dddddd;

}


/* PET LIST */

.pet-list {

    display: none;

    margin-top: 15px;

}


.search {

    width: 100%;

    padding: 10px;

    margin-bottom: 12px;

    border: 1px solid #cccccc;

    border-radius: 8px;

    font-size: 15px;

    outline: none;

}


.player-options {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

}


.player-option {

    display: flex;

    align-items: center;

    gap: 8px;

    min-width: 135px;

    padding: 8px 12px;

    border: none;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 14px;

    cursor: pointer;

}


.player-option:hover {

    background: #dddddd;

}


.player-image {

    width: 42px;

    height: 42px;

    object-fit: cover;

    border-radius: 8px;

}


.player-info {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

}


.player-name {

    font-weight: bold;

}


.player-value {

    font-size: 13px;

    opacity: 0.7;

}


/* HISTORY */

.history {

    margin-top: 15px;

    max-height: 180px;

    overflow-y: auto;

    text-align: left;

}


.history-item {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 5px 0;

    padding: 8px;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;

}


.history-image {

    width: 30px;

    height: 30px;

    object-fit: cover;

    border-radius: 6px;

}


/* RESULT */

.result {

    margin-top: 20px;

    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;

    font-weight: bold;

}


/* RESET */

.reset-button {

    margin-top: 15px;

    padding: 10px 20px;

    border: none;

    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;

}


.reset-button:hover {

    background: #dddddd;

}


/* MOBILE */

@media (max-width: 550px) {

    .players {

        flex-direction: column;

    }


    .player-box {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="gui">


    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">


            <div class="player-title">
                Player 1
            </div>


            <div
                id="total1"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openPetList(1)"
            >
                +
            </button>


            <div
                id="petList1"
                class="pet-list"
            >


                <input
                    id="search1"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(1)"
                >


                <div
                    id="players1"
                    class="player-options"
                >
                </div>


            </div>


            <div
                id="history1"
                class="history"
            >
            </div>


        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">


            <div class="player-title">
                Player 2
            </div>


            <div
                id="total2"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openPetList(2)"
            >
                +
            </button>


            <div
                id="petList2"
                class="pet-list"
            >


                <input
                    id="search2"
                    class="search"
                    type="text"
                    placeholder="Search pet..."
                    oninput="searchPets(2)"
                >


                <div
                    id="players2"
                    class="player-options"
                >
                </div>


            </div>


            <div
                id="history2"
                class="history"
            >
            </div>


        </div>


    </div>



    <!-- RESULT -->

    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>



    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>


</div>



<script>


/*
====================================================
PET LIST

WRITE PETS LIKE THIS:

Name,Value,Image

Example:

Kharvoth,60,images/Kharvoth.png
Nythrael,30,images/Nythrael.png

NO brackets.
NO parentheses.
NO objects.

The order here is the order shown in the GUI.
====================================================
*/

const petData = `

Hellish Pumpkin,?,images/Pumpkin_V2.png
Infernal Luminance,?,images/DRadiance.png
Pyraminfernal,?,images/Pyramfernal.png
Apocalyptic Trident,?,images/Tridente.png
Bloody Eye,?,images/Blood_eye.png
Lunatic Eye,?,images/Ojo_lunatico.png
Cursed Guardian,?,images/Demonic_Cursed.png
Ommeviathan,?,images/Omegaa.png
Pyramighost,?,images/Pyramghost.png

`;



/*
====================================================
CONVERT TEXT INTO PET DATA
====================================================
*/

const pets = [];


petData
    .trim()
    .split("\n")
    .forEach(function(line) {


        line = line.trim();


        if (!line) {
            return;
        }


        const parts =
            line.split(",");


        const name =
            parts[0].trim();


        const value =
            Number(parts[1].trim());


        const image =
            parts.slice(2)
                .join(",")
                .trim();


        if (
            name &&
            !isNaN(value) &&
            image
        ) {

            pets.push({

                name: name,

                value: value,

                image: image

            });

        }

    });



/*
====================================================
PLAYER VALUES
====================================================
*/

let total1 = 0;

let total2 = 0;



/*
====================================================
OPEN PET LIST
====================================================
*/

function openPetList(player) {


    const list =
        document.getElementById(
            "petList" + player
        );


    if (
        list.style.display === "block"
    ) {

        list.style.display = "none";

    }

    else {

        list.style.display = "block";

        createPetButtons(player);

    }

}



/*
====================================================
CREATE PET BUTTONS
====================================================
*/

function createPetButtons(player) {


    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    if (pets.length === 0) {


        const empty =
            document.createElement(
                "div"
            );


        empty.textContent =
            "No pets available yet.";


        container.appendChild(
            empty
        );


        return;

    }



    pets.forEach(function(pet) {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "player-option";


        button.dataset.name =
            pet.name.toLowerCase();



        /*
        IMAGE
        */

        const image =
            document.createElement(
                "img"
            );


        image.className =
            "player-image";


        image.src =
            pet.image;


        image.alt =
            pet.name;



        /*
        INFO
        */

        const info =
            document.createElement(
                "div"
            );


        info.className =
            "player-info";



        const name =
            document.createElement(
                "div"
            );


        name.className =
            "player-name";


        name.textContent =
            pet.name;



        const value =
            document.createElement(
                "div"
            );


        value.className =
            "player-value";


        value.textContent =
            "+" + pet.value;



        info.appendChild(name);

        info.appendChild(value);


        button.appendChild(image);

        button.appendChild(info);



        /*
        ADD PET

        Clicking the same pet multiple times
        adds it multiple times.
        */

        button.onclick =
            function() {


                addPet(

                    player,

                    pet.name,

                    pet.value,

                    pet.image

                );

            };



        container.appendChild(
            button
        );


    });

}



/*
====================================================
SEARCH
====================================================
*/

function searchPets(player) {


    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value.toLowerCase();


    const buttons =
        document
            .getElementById(
                "players" + player
            )
            .querySelectorAll(
                ".player-option"
            );


    buttons.forEach(
        function(button) {


            const name =
                button.dataset.name;


            if (
                name.includes(text)
            ) {

                button.style.display =
                    "flex";

            }

            else {

                button.style.display =
                    "none";

            }


        }
    );

}



/*
====================================================
ADD PET
====================================================
*/

function addPet(
    player,
    name,
    value,
    image
) {


    if (player === 1) {


        total1 += value;


        document.getElementById(
            "total1"
        ).textContent =
            total1;


        addHistory(

            1,

            name,

            value,

            image

        );


    }

    else {


        total2 += value;


        document.getElementById(
            "total2"
        ).textContent =
            total2;


        addHistory(

            2,

            name,

            value,

            image

        );


    }


    checkTrade();

}



/*
====================================================
HISTORY
====================================================
*/

function addHistory(
    player,
    name,
    value,
    image
) {


    const history =
        document.getElementById(
            "history" + player
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item";



    const imageElement =
        document.createElement(
            "img"
        );


    imageElement.className =
        "history-image";


    imageElement.src =
        image;


    imageElement.alt =
        name;



    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        name + " +" + value;



    item.appendChild(
        imageElement
    );


    item.appendChild(
        text
    );


    history.appendChild(
        item
    );


    history.scrollTop =
        history.scrollHeight;

}



/*
====================================================
TRADE CALCULATION

Player 1 = YOU

Player 1 value = what YOU GIVE.

Player 2 value = what YOU RECEIVE.

Example:

P1 = 0
P2 = 60

You win 60.

P1 = 60
P2 = 0

You are losing 60.

P1 = 60
P2 = 60

Balanced Trade.
====================================================
*/

function checkTrade() {


    const result =
        document.getElementById(
            "result"
        );



    if (
        total1 === 0 &&
        total2 === 0
    ) {


        result.textContent =
            "Waiting for players...";


        return;

    }



    /*
    YOU RECEIVE MORE
    */

    if (
        total2 > total1
    ) {


        const difference =
            total2 - total1;


        result.textContent =

            "You win " +

            difference +

            " value! [W Trade]";


        return;

    }



    /*
    YOU GIVE MORE
    */

    if (
        total1 > total2
    ) {


        const difference =
            total1 - total2;


        result.textContent =

            "You are losing " +

            difference +

            " value! [L Trade]";


        return;

    }



    /*
    SAME VALUE
    */

    result.textContent =
        "Balanced Trade! [B Trade]";

}



/*
====================================================
RESET
====================================================
*/

function resetGame() {


    total1 = 0;

    total2 = 0;



    document.getElementById(
        "total1"
    ).textContent =
        "0";


    document.getElementById(
        "total2"
    ).textContent =
        "0";



    document.getElementById(
        "history1"
    ).innerHTML =
        "";


    document.getElementById(
        "history2"
    ).innerHTML =
        "";



    document.getElementById(
        "result"
    ).textContent =
        "Waiting for players...";



    document.getElementById(
        "petList1"
    ).style.display =
        "none";


    document.getElementById(
        "petList2"
    ).style.display =
        "none";


    document.getElementById(
        "search1"
    ).value =
        "";


    document.getElementById(
        "search2"
    ).value =
        "";

}

</script>


</body>

</html>
