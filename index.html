<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 800px;
    margin: auto;
    padding: 20px;

    background: white;
    border-radius: 16px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

    text-align: center;
}

.title {
    margin-top: 0;
    margin-bottom: 20px;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;
    padding: 15px;

    border: 2px solid #dddddd;
    border-radius: 12px;

    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;

    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: #eeeeee;

    font-size: 30px;

    cursor: pointer;
}

.add-button:hover {
    background: #dddddd;
}

.player-list {
    display: none;
    margin-top: 15px;
}

.search {
    width: 100%;

    padding: 10px;
    margin-bottom: 12px;

    border: 1px solid #cccccc;
    border-radius: 8px;

    font-size: 15px;
    outline: none;
}

.player-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    justify-content: center;
}

.player-option {
    flex: 0 0 auto;

    padding: 10px 14px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    font-size: 14px;

    cursor: pointer;
}

.player-option:hover {
    background: #dddddd;
}

.history {
    margin-top: 15px;

    max-height: 180px;

    overflow-y: auto;

    text-align: left;
}

.history-item {
    margin: 5px 0;

    padding: 8px;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;
}

.result {
    margin-top: 20px;

    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;
    font-weight: bold;
}

.reset-button {
    margin-top: 15px;

    padding: 10px 20px;

    border: none;
    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;
}

.reset-button:hover {
    background: #dddddd;
}

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L
    </h2>


    <div class="players">


        <!-- PLAYER 1 -->

        <div class="player-box">

            <div class="player-title">
                Player 1
            </div>

            <div
                id="total1"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(1)"
            >
                +
            </button>


            <div
                id="list1"
                class="player-list"
            >

                <input
                    id="search1"
                    class="search"
                    type="text"
                    placeholder="Search player..."
                    oninput="searchPlayers(1)"
                >


                <div
                    id="players1"
                    class="player-options"
                >
                </div>

            </div>


            <div
                id="history1"
                class="history"
            >
            </div>

        </div>



        <!-- PLAYER 2 -->

        <div class="player-box">

            <div class="player-title">
                Player 2
            </div>

            <div
                id="total2"
                class="total"
            >
                0
            </div>


            <button
                class="add-button"
                onclick="openList(2)"
            >
                +
            </button>


            <div
                id="list2"
                class="player-list"
            >

                <input
                    id="search2"
                    class="search"
                    type="text"
                    placeholder="Search player..."
                    oninput="searchPlayers(2)"
                >


                <div
                    id="players2"
                    class="player-options"
                >
                </div>

            </div>


            <div
                id="history2"
                class="history"
            >
            </div>

        </div>


    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for players...
    </div>


    <button
        class="reset-button"
        onclick="resetGame()"
    >
        Reset
    </button>


</div>



<script>


/* =========================================
   PLAYER LIST

   ONLY EDIT THIS PART
========================================= */

const playerData = `

Messi,1000
Neymar,5000
Ronaldo,2300
Mbappe,20
Vinicius,15
Salah,12
Haaland,25
Bellingham,18

`;



/* =========================================
   CONVERT PLAYER LIST INTO DATA
========================================= */

const players = playerData
    .trim()
    .split("\n")
    .map(line => {

        const parts = line.split(",");

        return {
            name: parts[0].trim(),
            value: Number(parts[1].trim())
        };

    });



/* =========================================
   TOTALS
========================================= */

let total1 = 0;
let total2 = 0;



/* =========================================
   CREATE PLAYER BUTTONS
========================================= */

function createPlayerButtons(player) {

    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    players.forEach(function(data) {


        const button =
            document.createElement("button");


        button.className =
            "player-option";


        button.textContent =
            data.name +
            " +" +
            data.value;


        button.dataset.name =
            data.name.toLowerCase();


        button.onclick =
            function() {

                addPlayer(
                    player,
                    data.name,
                    data.value
                );

            };


        container.appendChild(button);

    });

}



/* =========================================
   CREATE BOTH LISTS
========================================= */

createPlayerButtons(1);
createPlayerButtons(2);



/* =========================================
   OPEN LIST
========================================= */

function openList(player) {

    const list =
        document.getElementById(
            "list" + player
        );


    if (list.style.display === "block") {

        list.style.display = "none";

    } else {

        list.style.display = "block";


        document.getElementById(
            "search" + player
        ).focus();

    }

}



/* =========================================
   SEARCH
========================================= */

function searchPlayers(player) {

    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value.toLowerCase();


    const buttons =
        document
            .getElementById(
                "players" + player
            )
            .querySelectorAll(
                ".player-option"
            );


    buttons.forEach(function(button) {

        const name =
            button.dataset.name;


        if (name.includes(text)) {

            button.style.display =
                "block";

        } else {

            button.style.display =
                "none";

        }

    });

}



/* =========================================
   ADD ONE PLAYER
========================================= */

function addPlayer(player, name, value) {


    if (player === 1) {


        total1 += value;


        document.getElementById(
            "total1"
        ).textContent = total1;


        document.getElementById(
            "history1"
        ).innerHTML +=
            '<div class="history-item">' +
            name +
            ' +' +
            value +
            '</div>';


        document.getElementById(
            "list1"
        ).style.display = "none";


    } else {


        total2 += value;


        document.getElementById(
            "total2"
        ).textContent = total2;


        document.getElementById(
            "history2"
        ).innerHTML +=
            '<div class="history-item">' +
            name +
            ' +' +
            value +
            '</div>';


        document.getElementById(
            "list2"
        ).style.display = "none";

    }


    checkWinner();

}



/* =========================================
   CHECK WINNER
========================================= */

function checkWinner() {

    const result =
        document.getElementById(
            "result"
        );


    if (
        total1 === 0 &&
        total2 === 0
    ) {

        result.textContent =
            "Waiting for players...";

    }

    else if (total1 > total2) {

        result.textContent =
            "You win value.";

    }

    else if (total2 > total1) {

        result.textContent =
            "You are losing value.";

    }

    else {

        result.textContent =
            "Draw";

    }

}



/* =========================================
   RESET
========================================= */

function resetGame() {

    total1 = 0;
    total2 = 0;


    document.getElementById(
        "total1"
    ).textContent = "0";


    document.getElementById(
        "total2"
    ).textContent = "0";


    document.getElementById(
        "history1"
    ).innerHTML = "";


    document.getElementById(
        "history2"
    ).innerHTML = "";


    document.getElementById(
        "result"
    ).textContent =
        "Waiting for players...";


    document.getElementById(
        "list1"
    ).style.display = "none";


    document.getElementById(
        "list2"
    ).style.display = "none";


    document.getElementById(
        "search1"
    ).value = "";


    document.getElementById(
        "search2"
    ).value = "";


    searchPlayers(1);
    searchPlayers(2);

}

</script>


</body>

</html>
