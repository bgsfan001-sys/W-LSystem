<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W/L System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #eeeeee;
    font-family: Arial, sans-serif;
}

.gui {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    text-align: center;
}

.title {
    margin-top: 0;
    margin-bottom: 20px;
}


/* =========================
   MENU DE SECCIONES
========================= */

.section-menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.section-card {
    border: none;
    background: #eeeeee;
    border-radius: 14px;
    padding: 10px;
    cursor: pointer;
}

.section-card:hover {
    background: #dddddd;
}

.section-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    border-radius: 10px;
}

.section-name {
    font-size: 17px;
    font-weight: bold;
    margin-top: 8px;
}


/* =========================
   TRADE
========================= */

.trade-screen {
    display: none;
}

.back-button {
    border: none;
    background: #eeeeee;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 12px;
}

.players {
    display: flex;
    gap: 15px;
}

.player-box {
    width: 50%;
    padding: 15px;
    border: 2px solid #dddddd;
    border-radius: 12px;
    background: #fafafa;
}

.player-title {
    font-size: 20px;
    font-weight: bold;
}

.total {
    margin: 10px;
    font-size: 28px;
    font-weight: bold;
}

.add-button {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #eeeeee;
    font-size: 30px;
    cursor: pointer;
}


/* =========================
   LISTA DE PETS
========================= */

.pet-list {
    display: none;
    margin-top: 15px;
}

.search {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #cccccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.player-options {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
}

.player-option {
    display: flex;
    flex-direction: column;
    align-items: center;

    width: 100%;
    min-width: 0;

    padding: 8px;

    border: none;
    border-radius: 10px;

    background: #eeeeee;

    font-size: 13px;

    cursor: pointer;
    text-align: center;
}

.player-option:hover {
    background: #dddddd;
}

.player-image {
    width: 65px;
    height: 65px;

    object-fit: contain;

    border-radius: 8px;

    margin-bottom: 5px;
}

.player-name {
    font-weight: bold;

    width: 100%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.player-value {
    font-size: 12px;
    margin-top: 3px;
}

.player-hatched {
    font-size: 12px;
    margin-top: 2px;
    opacity: 0.7;
}


/* =========================
   PETS DEL TRADE
========================= */

.history {
    margin-top: 15px;

    max-height: 180px;

    overflow-y: auto;

    text-align: left;
}

.history-item {
    display: flex;

    align-items: center;

    gap: 8px;

    width: 100%;

    margin: 5px 0;

    padding: 8px;

    border: none;

    border-radius: 7px;

    background: #eeeeee;

    font-size: 14px;

    cursor: pointer;

    text-align: left;
}

.history-image {
    width: 30px;
    height: 30px;

    object-fit: contain;

    border-radius: 6px;
}


/* =========================
   RESULTADO
========================= */

.result {
    margin-top: 20px;

    padding: 12px;

    border-radius: 10px;

    background: #eeeeee;

    font-size: 20px;

    font-weight: bold;
}

.reset-button {
    margin-top: 15px;

    padding: 10px 20px;

    border: none;

    border-radius: 8px;

    background: #eeeeee;

    cursor: pointer;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .section-menu {
        grid-template-columns: 1fr;
    }

    .player-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 550px) {

    .players {
        flex-direction: column;
    }

    .player-box {
        width: 100%;
    }
}

</style>
</head>


<body>


<div class="gui">

    <h2 class="title">
        W / L System
    </h2>


    <!-- =========================
         SECCIONES
    ========================== -->

    <div id="sectionMenu" class="section-menu">

        <button
            class="section-card"
            onclick="openSection('Limited Secrets')"
        >

            <img
                class="section-image"
                src="images/LimitedSecrets.png"
            >

            <div class="section-name">
                Limited Secrets
            </div>

        </button>


        <button
            class="section-card"
            onclick="openSection('Robux Pets')"
        >

            <img
                class="section-image"
                src="images/RobuxPets.png"
            >

            <div class="section-name">
                Robux Pets
            </div>

        </button>


        <button
            class="section-card"
            onclick="openSection('Perm Secrets')"
        >

            <img
                class="section-image"
                src="images/PermSecrets.png"
            >

            <div class="section-name">
                Perm Secrets
            </div>

        </button>

    </div>



    <!-- =========================
         TRADE SCREEN
    ========================== -->

    <div id="tradeScreen" class="trade-screen">

        <button
            class="back-button"
            onclick="goBack()"
        >
            Back
        </button>


        <h3 id="sectionTitle"></h3>


        <div class="players">


            <!-- PLAYER 1 -->

            <div class="player-box">

                <div class="player-title">
                    Player 1
                </div>

                <div id="total1" class="total">
                    0
                </div>

                <button
                    class="add-button"
                    onclick="openPetList(1)"
                >
                    +
                </button>


                <div
                    id="petList1"
                    class="pet-list"
                >

                    <input
                        id="search1"
                        class="search"
                        type="text"
                        placeholder="Search pet..."
                        oninput="searchPets(1)"
                    >


                    <div
                        id="players1"
                        class="player-options"
                    ></div>

                </div>


                <div
                    id="history1"
                    class="history"
                ></div>

            </div>



            <!-- PLAYER 2 -->

            <div class="player-box">

                <div class="player-title">
                    Player 2
                </div>

                <div id="total2" class="total">
                    0
                </div>

                <button
                    class="add-button"
                    onclick="openPetList(2)"
                >
                    +
                </button>


                <div
                    id="petList2"
                    class="pet-list"
                >

                    <input
                        id="search2"
                        class="search"
                        type="text"
                        placeholder="Search pet..."
                        oninput="searchPets(2)"
                    >


                    <div
                        id="players2"
                        class="player-options"
                    ></div>

                </div>


                <div
                    id="history2"
                    class="history"
                ></div>

            </div>

        </div>


        <div
            id="result"
            class="result"
        >
            Waiting for players...
        </div>


        <button
            class="reset-button"
            onclick="resetGame()"
        >
            Reset
        </button>

    </div>

</div>



<script>


/* =========================
   PET DATA
========================= */

const petData = `


Limited Secrets

Electric Basilisk,NA,images/Electric_Basilisk.png
Shiny Electric Basilisk,NA,images/Electric_Basilisk.png
Mythic Electric Basilisk,NA,images/Electric_Basilisk.png
Shiny Mythic Electric Basilisk,NA,images/Electric_Basilisk.png

Air Basilisk,NA,images/Air_Basilisk.png
Shiny Air Basilisk,NA,images/Air_Basilisk.png
Mythic Air Basilisk,NA,images/Air_Basilisk.png
Shiny Mythic Air Basilisk,NA,images/Air_Basilisk.png

Ice Basilisk,NA,images/Ice_Basilisk.png
Shiny Ice Basilisk,NA,images/Ice_Basilisk.png
Mythic Ice Basilisk,NA,images/Ice_Basilisk.png
Shiny Mythic Ice Basilisk,NA,images/Ice_Basilisk.png

Fire Basilisk,NA,images/Fire_Basilisk.png
Shiny Fire Basilisk,NA,images/Fire_Basilisk.png
Mythic Fire Basilisk,NA,images/Fire_Basilisk.png
Shiny Mythic Fire Basilisk,NA,images/Fire_Basilisk.png

Ultima,NA,images/Ultima.png
Shiny Ultima,NA,images/Ultima.png
Mythic Ultima,NA,images/Ultima.png
Shiny Mythic Ultima,NA,images/Ultima.png

Overlord Plushie,NA,images/Overlord_Plushie.png
Shiny Overlord Plushie,NA,images/Overlord_Plushie.png
Mythic Overlord Plushie,NA,images/Overlord_Plushie.png
Shiny Mythic Overlord Plushie,NA,images/Overlord_Plushie.png

Release Champion,NA,images/Release_Champion.png
Shiny Release Champion,NA,images/Release_Champion.png
Mythic Release Champion,NA,images/Release_Champion.png
Shiny Mythic Release Champion,NA,images/Release_Champion.png

Release Trophy 2.0,NA,images/Release_Trophy_2.png
Shiny Release Trophy 2.0,NA,images/Release_Trophy_2.png
Mythic Release Trophy 2.0,NA,images/Release_Trophy_2.png
Shiny Mythic Release Trophy 2.0,NA,images/Release_Trophy_2.png

Release Shard,NA,images/Release_Shard.png
Shiny Release Shard,NA,images/Release_Shard.png
Mythic Release Shard,NA,images/Release_Shard.png
Shiny Mythic Release Shard,NA,images/Release_Shard.png

Release Robot,NA,images/Release_Robot.png
Shiny Release Robot,NA,images/Release_Robot.png
Mythic Release Robot,NA,images/Release_Robot.png
Shiny Mythic Release Robot,NA,images/Release_Robot.png

Eternal Carrot,NA,images/Eternal_Carrot.png
Shiny Eternal Carrot,NA,images/Eternal_Carrot.png
Mythic Eternal Carrot,NA,images/Eternal_Carrot.png
Shiny Mythic Eternal Carrot,NA,images/Eternal_Carrot.png

Patronus,NA,images/Patronus.png
Shiny Patronus,NA,images/Patronus.png
Mythic Patronus,NA,images/Patronus.png
Shiny Mythic Patronus,NA,images/Patronus.png

Easter Robot,NA,images/Easter_Robot.png
Shiny Easter Robot,NA,images/Easter_Robot.png
Mythic Easter Robot,NA,images/Easter_Robot.png
Shiny Mythic Easter Robot,NA,images/Easter_Robot.png

Dark Radiance,NA,images/Dark_Radiance.png
Shiny Dark Radiance,NA,images/Dark_Radiance.png
Mythic Dark Radiance,NA,images/Dark_Radiance.png
Shiny Mythic Dark Radiance,NA,images/Dark_Radiance.png

Demonic One,NA,images/Demonic_One.png
Shiny Demonic One,NA,images/Demonic_One.png
Mythic Demonic One,NA,images/Demonic_One.png
Shiny Mythic Demonic One,NA,images/Demonic_One.png

Demonic Dogcat,NA,images/Demonic_Dogcat.png
Shiny Demonic Dogcat,NA,images/Demonic_Dogcat.png
Mythic Demonic Dogcat,NA,images/Demonic_Dogcat.png
Shiny Mythic Demonic Dogcat,NA,images/Demonic_Dogcat.png

Leviathan,NA,images/Leviathan.png
Shiny Leviathan,NA,images/Leviathan.png
Mythic Leviathan,NA,images/Leviathan.png
Shiny Mythic Leviathan,NA,images/Leviathan.png

Almighty Trophy,NA,images/Almighty_Trophy.png
Shiny Almighty Trophy,NA,images/Almighty_Trophy.png
Mythic Almighty Trophy,NA,images/Almighty_Trophy.png
Shiny Mythic Almighty Trophy,NA,images/Almighty_Trophy.png

Eternal Cucumber,NA,images/Eternal_Cucumber.png
Shiny Eternal Cucumber,NA,images/Eternal_Cucumber.png
Mythic Eternal Cucumber,NA,images/Eternal_Cucumber.png
Shiny Mythic Eternal Cucumber,NA,images/Eternal_Cucumber.png

Dragonfruit,NA,images/Dragonfruit.png
Shiny Dragonfruit,NA,images/Dragonfruit.png
Mythic Dragonfruit,NA,images/Dragonfruit.png
Shiny Mythic Dragonfruit,NA,images/Dragonfruit.png


Robux Pets

Robux Doggy,NA,images/Robux_Doggy.png
Shiny Robux Doggy,NA,images/Robux_Doggy.png
Mythic Robux Doggy,NA,images/Robux_Doggy.png
Shiny Mythic Robux Doggy,NA,images/Robux_Doggy.png


Perm Secrets

Doggy,NA,images/Doggy.png
Shiny Doggy,NA,images/Doggy.png
Mythic Doggy,NA,images/Doggy.png
Shiny Mythic Doggy,NA,images/Doggy.png

`;


/* =========================
   PARSE DATA
========================= */

const pets = [];

let currentSection = "";


let activeSection = "";


petData
.trim()
.split(/\r?\n/)
.map(line => line.trim())
.forEach(line => {


    if (!line) return;


    if (
        line === "Limited Secrets" ||
        line === "Robux Pets" ||
        line === "Perm Secrets"
    ) {

        activeSection = line;

        return;
    }


    const parts = line.split(",");


    if (parts.length < 3) return;


    const name =
        parts[0].trim();


    const valueText =
        parts[1].trim();


    const image =
        parts.slice(2)
        .join(",")
        .trim();


    let value = 0;


    if (valueText !== "NA") {

        const number =
            Number(valueText);


        if (Number.isFinite(number)) {
            value = number;
        }

    }


    pets.push({

        name: name,

        value: value,

        valueText: valueText,

        image: image,

        hatched: 0,

        section: activeSection

    });

});



/* =========================
   PLAYER DATA
========================= */

const player1Pets = [];

const player2Pets = [];


let total1 = 0;

let total2 = 0;



/* =========================
   OPEN SECTION
========================= */

function openSection(section) {


    currentSection = section;


    document.getElementById("sectionMenu")
        .style.display = "none";


    document.getElementById("tradeScreen")
        .style.display = "block";


    document.getElementById("sectionTitle")
        .textContent = section;


    createPetButtons(1);

    createPetButtons(2);

}



/* =========================
   BACK
========================= */

function goBack() {


    document.getElementById("tradeScreen")
        .style.display = "none";


    document.getElementById("sectionMenu")
        .style.display = "grid";


    document.getElementById("petList1")
        .style.display = "none";


    document.getElementById("petList2")
        .style.display = "none";

}



/* =========================
   OPEN PET LIST
========================= */

function openPetList(player) {


    const list =
        document.getElementById(
            "petList" + player
        );


    if (list.style.display === "block") {

        list.style.display = "none";

    } else {

        list.style.display = "block";

        createPetButtons(player);

    }

}



/* =========================
   CREATE PET BUTTONS
========================= */

function createPetButtons(player) {


    const container =
        document.getElementById(
            "players" + player
        );


    container.innerHTML = "";


    pets
    .filter(
        pet =>
        pet.section === currentSection
    )
    .forEach(pet => {


        const button =
            document.createElement("button");


        button.type = "button";


        button.className =
            "player-option";


        button.dataset.name =
            pet.name.toLowerCase();



        const image =
            document.createElement("img");


        image.className =
            "player-image";


        image.src =
            pet.image;


        image.alt =
            pet.name;



        const name =
            document.createElement("div");


        name.className =
            "player-name";


        name.textContent =
            pet.name;



        const value =
            document.createElement("div");


        value.className =
            "player-value";


        value.textContent =
            "Value: " + pet.valueText;



        const hatched =
            document.createElement("div");


        hatched.className =
            "player-hatched";


        hatched.textContent =
            "Hatched: " + pet.hatched;



        button.appendChild(image);

        button.appendChild(name);

        button.appendChild(value);

        button.appendChild(hatched);



        button.onclick =
            function() {

                addPet(player, pet);

            };



        container.appendChild(button);

    });

}



/* =========================
   SEARCH
========================= */

function searchPets(player) {


    const search =
        document.getElementById(
            "search" + player
        );


    const text =
        search.value
        .toLowerCase()
        .trim();


    const buttons =
        document
        .getElementById(
            "players" + player
        )
        .querySelectorAll(
            ".player-option"
        );


    buttons.forEach(button => {


        const name =
            button.dataset.name;


        button.style.display =
            name.includes(text)
            ? "flex"
            : "none";

    });

}



/* =========================
   ADD PET
========================= */

function addPet(player, pet) {


    const tradePet = {


        id:
            Date.now() +
            Math.random(),


        name:
            pet.name,


        value:
            pet.value,


        valueText:
            pet.valueText,


        image:
            pet.image

    };


    if (player === 1) {

        player1Pets.push(tradePet);

    } else {

        player2Pets.push(tradePet);

    }


    updateTrade();

}



/* =========================
   REMOVE PET
========================= */

function removePet(player, petId) {


    const list =
        player === 1
        ? player1Pets
        : player2Pets;


    const index =
        list.findIndex(
            pet =>
            pet.id === petId
        );


    if (index !== -1) {

        list.splice(index, 1);

    }


    updateTrade();

}



/* =========================
   UPDATE TRADE
========================= */

function updateTrade() {


    total1 =
        calculateTotal(player1Pets);


    total2 =
        calculateTotal(player2Pets);


    document.getElementById("total1")
        .textContent = total1;


    document.getElementById("total2")
        .textContent = total2;


    renderTradePets(
        1,
        player1Pets
    );


    renderTradePets(
        2,
        player2Pets
    );


    checkTrade();

}



/* =========================
   CALCULATE TOTAL
========================= */

function calculateTotal(list) {


    return list.reduce(

        (total, pet) =>
            total + pet.value,

        0

    );

}



/* =========================
   RENDER TRADE PETS
========================= */

function renderTradePets(
    player,
    list
) {


    const history =
        document.getElementById(
            "history" + player
        );


    history.innerHTML = "";


    list.forEach(pet => {


        const button =
            document.createElement("button");


        button.type = "button";


        button.className =
            "history-item";



        const image =
            document.createElement("img");


        image.className =
            "history-image";


        image.src =
            pet.image;


        image.alt =
            pet.name;



        const text =
            document.createElement("span");


        text.textContent =
            pet.name +
            " +" +
            pet.valueText;



        button.appendChild(image);

        button.appendChild(text);



        button.onclick =
            function() {

                removePet(
                    player,
                    pet.id
                );

            };



        history.appendChild(button);

    });

}



/* =========================
   CHECK TRADE
========================= */

function checkTrade() {


    const result =
        document.getElementById(
            "result"
        );


    /*
       LOS DOS VACÍOS
    */

    if (
        player1Pets.length === 0 &&
        player2Pets.length === 0
    ) {

        result.textContent =
            "Waiting for players...";

        return;

    }



    /*
       PLAYER 1 NO OFRECE NADA
       PLAYER 2 OFRECE
       PLAYER 1 GANA
    */

    if (
        player1Pets.length === 0 &&
        player2Pets.length > 0
    ) {

        result.textContent =
            "Player 1 wins! [W Trade]";

        return;

    }



    /*
       PLAYER 2 NO OFRECE NADA
       PLAYER 1 OFRECE
       PLAYER 2 GANA
    */

    if (
        player2Pets.length === 0 &&
        player1Pets.length > 0
    ) {

        result.textContent =
            "Player 2 wins! [W Trade]";

        return;

    }



    /*
       AMBOS TIENEN PETS
    */

    if (total2 > total1) {

        result.textContent =
            "Player 1 wins " +
            (total2 - total1) +
            " value! [W Trade]";

        return;

    }


    if (total1 > total2) {

        result.textContent =
            "Player 2 wins " +
            (total1 - total2) +
            " value! [W Trade]";

        return;

    }


    result.textContent =
        "Balanced Trade! [B Trade]";

}



/* =========================
   RESET
========================= */

function resetGame() {


    player1Pets.length = 0;

    player2Pets.length = 0;


    total1 = 0;

    total2 = 0;


    document.getElementById("total1")
        .textContent = "0";


    document.getElementById("total2")
        .textContent = "0";


    document.getElementById("history1")
        .innerHTML = "";


    document.getElementById("history2")
        .innerHTML = "";


    document.getElementById("result")
        .textContent =
            "Waiting for players...";


    document.getElementById("petList1")
        .style.display = "none";


    document.getElementById("petList2")
        .style.display = "none";


    document.getElementById("search1")
        .value = "";


    document.getElementById("search2")
        .value = "";

}

</script>

</body>
</html>
